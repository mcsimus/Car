<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vremea Ta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%);
            background-attachment: fixed;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex justify-center p-4">
    <div class="max-w-md w-full space-y-5 pb-8">
        
        <!-- Header -->
        <div class="pt-2">
            <p class="text-blue-400 text-[10px] font-bold tracking-widest uppercase">Vremea Gratuit</p>
            <h1 class="text-3xl font-bold text-white mt-1">Vremea Ta</h1>
        </div>

        <!-- Upper Controls -->
        <div class="flex space-x-3">
            <button class="glass-card px-4 py-2.5 rounded-2xl flex items-center text-sm font-medium hover:bg-slate-700/60 transition">
                <i class="fa-solid fa-temperature-half mr-2 text-gray-300"></i> °C
            </button>
            <button id="btn-location" class="glass-card px-4 py-2.5 rounded-2xl flex items-center text-sm font-medium flex-1 justify-center hover:bg-slate-700/60 transition">
                <i class="fa-solid fa-location-crosshairs mr-2 text-gray-300"></i> Locația mea
            </button>
        </div>

        <!-- Search Bar -->
        <form id="search-form" class="flex relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="fa-solid fa-magnifying-glass text-gray-400"></i>
            </div>
            <input type="text" id="search-input" placeholder="Caută orice oraș, ex. Cluj-N" class="w-full glass-card pl-11 pr-4 py-3 rounded-l-2xl outline-none focus:ring-1 focus:ring-blue-500 text-sm placeholder-gray-400">
            <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-3 rounded-r-2xl font-medium transition text-sm">Caută</button>
        </form>

        <!-- City Pills -->
        <div class="flex flex-wrap gap-2 text-sm text-gray-300">
            <button class="city-btn glass-card px-3.5 py-1.5 rounded-full hover:bg-slate-700 transition">București</button>
            <button class="city-btn glass-card px-3.5 py-1.5 rounded-full hover:bg-slate-700 transition">Cluj-Napoca</button>
            <button class="city-btn glass-card px-3.5 py-1.5 rounded-full hover:bg-slate-700 transition">Timișoara</button>
            <button class="city-btn glass-card px-3.5 py-1.5 rounded-full hover:bg-slate-700 transition">Iași</button>
            <button class="city-btn glass-card px-3.5 py-1.5 rounded-full hover:bg-slate-700 transition">Brașov</button>
            <button class="city-btn glass-card px-3.5 py-1.5 rounded-full hover:bg-slate-700 transition">Constanța</button>
            <button class="city-btn glass-card px-3.5 py-1.5 rounded-full hover:bg-slate-700 transition">Sibiu</button>
        </div>

        <!-- Current Weather Card -->
        <div class="glass-card rounded-[2rem] p-6 shadow-lg border-t border-white/10 mt-6">
            <h2 id="city-name" class="text-base font-medium text-white">Constanța, România</h2>
            <div class="flex items-center justify-between mt-1">
                <div class="text-7xl font-bold text-white tracking-tighter"><span id="current-temp">--</span>°C</div>
                <i id="current-icon" class="fa-solid fa-sun text-5xl text-blue-400 drop-shadow-md"></i>
            </div>
            <p class="text-gray-300 text-sm mt-3"><span id="current-desc">Se încarcă...</span> · se resimte ca <span id="feels-like">--</span>°C</p>

            <div class="grid grid-cols-2 gap-3 mt-6">
                <div class="glass-card rounded-2xl p-3 bg-slate-800/40">
                    <div class="text-gray-400 text-xs flex items-center mb-1.5"><i class="fa-solid fa-wind mr-2"></i> Vânt</div>
                    <div class="font-medium text-sm text-white"><span id="wind-speed">--</span> km/h</div>
                </div>
                <div class="glass-card rounded-2xl p-3 bg-slate-800/40">
                    <div class="text-gray-400 text-xs flex items-center mb-1.5"><i class="fa-solid fa-droplet mr-2"></i> Umiditate</div>
                    <div class="font-medium text-sm text-white"><span id="humidity">--</span>%</div>
                </div>
                <div class="glass-card rounded-2xl p-3 bg-slate-800/40 col-span-2 w-1/2 pr-2">
                    <div class="text-gray-400 text-xs flex items-center mb-1.5"><i class="fa-solid fa-temperature-empty mr-2"></i> Precipitații</div>
                    <div class="font-medium text-sm text-white"><span id="precip">--</span> mm</div>
                </div>
            </div>
        </div>

        <!-- Hourly Forecast -->
        <div class="glass-card rounded-3xl p-5 border-t border-white/5">
            <h3 class="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-4">Următoarele 24 de ore</h3>
            <div id="hourly-container" class="flex overflow-x-auto space-x-3 hide-scroll pb-1">
                <!-- Javascript va injecta orele aici -->
            </div>
        </div>

        <!-- 7 Days Forecast -->
        <div class="glass-card rounded-3xl p-5 border-t border-white/5">
            <h3 class="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-4">Prognoza pe 7 zile</h3>
            <div id="daily-container" class="space-y-4">
                <!-- Javascript va injecta zilele aici -->
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center text-xs text-gray-500 pt-2 flex justify-between items-center px-1">
            <span>Date de la Open-Meteo.</span>
            <span class="flex items-center text-gray-400"><i class="fa-solid fa-bolt mr-1 text-blue-500"></i> Personalizat</span>
        </div>
    </div>

    <script>
        const WMO_CODES = {
            0: { desc: 'Cer senin', icon: 'fa-sun' },
            1: { desc: 'Preponderent senin', icon: 'fa-sun' },
            2: { desc: 'Parțial înnorat', icon: 'fa-cloud-sun' },
            3: { desc: 'Înnorat', icon: 'fa-cloud' },
            45: { desc: 'Ceață', icon: 'fa-smog' },
            48: { desc: 'Ceață înghețată', icon: 'fa-smog' },
            51: { desc: 'Burniță ușoară', icon: 'fa-cloud-rain' },
            53: { desc: 'Burniță moderată', icon: 'fa-cloud-rain' },
            55: { desc: 'Burniță densă', icon: 'fa-cloud-rain' },
            61: { desc: 'Ploaie ușoară', icon: 'fa-cloud-rain' },
            63: { desc: 'Ploaie moderată', icon: 'fa-cloud-showers-water' },
            65: { desc: 'Ploaie puternică', icon: 'fa-cloud-showers-heavy' },
            71: { desc: 'Ninsoare ușoară', icon: 'fa-snowflake' },
            73: { desc: 'Ninsoare moderată', icon: 'fa-snowflake' },
            75: { desc: 'Ninsoare puternică', icon: 'fa-snowflake' },
            80: { desc: 'Averse ușoare', icon: 'fa-cloud-rain' },
            81: { desc: 'Averse moderate', icon: 'fa-cloud-showers-heavy' },
            82: { desc: 'Averse violente', icon: 'fa-cloud-showers-heavy' },
            95: { desc: 'Furtună', icon: 'fa-cloud-bolt' },
            96: { desc: 'Furtună cu grindină', icon: 'fa-cloud-bolt' },
            99: { desc: 'Furtună severă', icon: 'fa-cloud-bolt' },
        };

        const daysRO = ['Dum.', 'Lun.', 'Mar.', 'Mie.', 'Joi', 'Vin.', 'Sâm.'];

        async function getCoordinates(city) {
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=en&format=json`);
                const data = await res.json();
                return data.results && data.results.length > 0 ? data.results[0] : null;
            } catch (err) {
                console.error("Eroare la obținerea coordonatelor:", err);
                return null;
            }
        }

        async function getWeatherData(lat, lon) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`;
            const res = await fetch(url);
            return await res.json();
        }

        function updateUI(weather, locationName, country) {
            document.getElementById('city-name').textContent = `${locationName}, ${country}`;
            document.getElementById('current-temp').textContent = Math.round(weather.current.temperature_2m);
            document.getElementById('feels-like').textContent = Math.round(weather.current.apparent_temperature);
            document.getElementById('wind-speed').textContent = Math.round(weather.current.wind_speed_10m);
            document.getElementById('humidity').textContent = weather.current.relative_humidity_2m;
            document.getElementById('precip').textContent = weather.current.precipitation;
            
            const codeInfo = WMO_CODES[weather.current.weather_code] || WMO_CODES[0];
            document.getElementById('current-desc').textContent = codeInfo.desc;
            document.getElementById('current-icon').className = `fa-solid ${codeInfo.icon} text-5xl text-blue-400 drop-shadow-md`;

            // Afișare pentru următoarele 24h (din oră în oră)
            const hourlyContainer = document.getElementById('hourly-container');
            hourlyContainer.innerHTML = '';
            const currentHourIdx = weather.hourly.time.findIndex(t => new Date(t) >= new Date());
            
            for(let i = currentHourIdx; i < currentHourIdx + 24; i+=1) { 
                if(!weather.hourly.time[i]) break;
                const timeObj = new Date(weather.hourly.time[i]);
                const hourStr = timeObj.getHours().toString().padStart(2, '0') + ':00';
                const temp = Math.round(weather.hourly.temperature_2m[i]);
                const hCodeInfo = WMO_CODES[weather.hourly.weather_code[i]] || WMO_CODES[0];
                
                hourlyContainer.innerHTML += `
                    <div class="glass-card bg-slate-800/40 rounded-2xl p-3 min-w-[70px] flex flex-col items-center justify-center space-y-2 border border-white/5">
                        <div class="text-xs text-gray-300">${hourStr}</div>
                        <i class="fa-solid ${hCodeInfo.icon} text-blue-400 text-lg"></i>
                        <div class="font-bold text-sm text-white">${temp}°</div>
                    </div>
                `;
            }

            // Prognoza pe 7 zile
            const dailyContainer = document.getElementById('daily-container');
            dailyContainer.innerHTML = '';
            for(let i = 0; i < 7; i++) {
                const dateObj = new Date(weather.daily.time[i]);
                const isToday = i === 0;
                const dayName = isToday ? 'Astăzi' : daysRO[dateObj.getDay()];
                const minTemp = Math.round(weather.daily.temperature_2m_min[i]);
                const maxTemp = Math.round(weather.daily.temperature_2m_max[i]);
                const precipProb = weather.daily.precipitation_probability_max[i] || 0;
                const dCodeInfo = WMO_CODES[weather.daily.weather_code[i]] || WMO_CODES[0];

                dailyContainer.innerHTML += `
                    <div class="flex items-center justify-between text-sm border-b border-gray-700/50 pb-3 last:border-0 last:pb-0">
                        <div class="w-16 font-medium text-white">${dayName}</div>
                        <div class="w-8 flex justify-center"><i class="fa-solid ${dCodeInfo.icon} text-blue-400"></i></div>
                        <div class="w-12 text-center text-gray-400 text-xs">${precipProb}%</div>
                        <div class="w-24 text-right font-medium text-white">${maxTemp}° <span class="text-gray-400 font-normal ml-1">/ ${minTemp}°</span></div>
                    </div>
                `;
            }
        }

        async function loadCity(city) {
            const location = await getCoordinates(city);
            if(location) {
                const weather = await getWeatherData(location.latitude, location.longitude);
                updateUI(weather, location.name, location.country_code);
            } else {
                alert("Orașul nu a fost găsit. Te rugăm să încerci din nou.");
            }
        }

        // Inițializare aplicație
        loadCity('Constanța');

        // Bara de căutare
        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const city = document.getElementById('search-input').value.trim();
            if(city) loadCity(city);
            document.getElementById('search-input').value = '';
        });

        // Butoanele rapide (Pilule)
        document.querySelectorAll('.city-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                loadCity(btn.innerText);
            });
        });

        // Funcția de localizare
        document.getElementById('btn-location').addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        const weather = await getWeatherData(lat, lon);
                        // Open-Meteo nu returnează numele orașului pentru coordonate brute, așa că folosim un nume generic
                        updateUI(weather, "Locația ta", "Curentă");
                    } catch (err) {
                        alert("Eroare la preluarea datelor meteo.");
                    }
                }, () => {
                    alert("Nu am putut accesa locația. Verifică permisiunile browserului.");
                });
            } else {
                alert("Geolocația nu este suportată de acest browser.");
            }
        });
    </script>
</body>
</html>
